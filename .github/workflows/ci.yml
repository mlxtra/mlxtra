name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Swift and Metadata
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Validate release metadata
        run: python3 Scripts/validate-release-metadata.py

      - name: Compile Python bridge scripts
        run: >
          python3 -m py_compile
          MLXtra/Resources/python_bridge.py
          MLXtra/Resources/acestep_bridge.py
          MLXtra/Resources/bridge_utils.py
          MLXtra/Resources/runtime/macos-arm64/hf_download_helper.py
          MLXtra/Resources/runtime/macos-arm64/acestep_download_helper.py
          Scripts/validate-release-metadata.py
          Tests/IntegrationTests/test_all_models_integration.py
          Tests/IntegrationTests/test_bridge.py
          Tests/IntegrationTests/test_music_bridge.py
          Tests/IntegrationTests/test_music_generation.py
          Tests/IntegrationTests/test_music_integration.py

      - name: Run Python bridge tests
        working-directory: Tests/PythonTests
        run: PYTHONPATH=../../../MLXtra/Resources python3 -m unittest discover -v

      - name: Run Swift tests with core coverage gate
        run: Scripts/check-swift-coverage.sh
        env:
          MLXTRA_CORE_COVERAGE_MIN: "80"

      - name: Build app shell
        run: xcodebuild -project MLXtra.xcodeproj -scheme MLXtra -configuration Debug CODE_SIGNING_ALLOWED=NO build
        env:
          MLXTRA_SKIP_RUNTIME_VALIDATION: "1"
