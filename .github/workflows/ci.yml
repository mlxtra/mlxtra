name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Swift and Metadata
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6.0.2

      - name: Show Xcode version
        run: Scripts/ci.sh xcode-version

      - name: Validate release metadata
        run: Scripts/ci.sh metadata

      - name: Compile Python bridge scripts
        run: Scripts/ci.sh py-compile

      - name: Validate runtime archive
        run: Scripts/ci.sh runtime-archive

      - name: Run Python bridge tests
        run: Scripts/ci.sh python-tests

      - name: Run Swift tests with core coverage gate
        run: Scripts/ci.sh swift-coverage
        env:
          MLXTRA_CORE_COVERAGE_MIN: "80"

      - name: Build app shell
        run: Scripts/ci.sh build-app
        env:
          MLXTRA_SKIP_RUNTIME_VALIDATION: "1"
